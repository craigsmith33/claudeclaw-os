[phases.setup]
# Browser (Chromium) runtime libs. Several were renamed with a `t64`
# suffix in Ubuntu 24.04's 64-bit time_t transition, which is what the
# current Railway/nixpacks base image uses. Using the old names breaks the
# build with "has no installation candidate".
aptPkgs = [
  "libnss3", "libnspr4", "libatk1.0-0t64", "libatk-bridge2.0-0t64",
  "libcups2t64", "libdrm2", "libdbus-1-3", "libxkbcommon0",
  "libxcomposite1", "libxdamage1", "libxfixes3", "libxrandr2",
  "libgbm1", "libpango-1.0-0", "libcairo2", "libasound2t64", "libatspi2.0-0t64"
]
